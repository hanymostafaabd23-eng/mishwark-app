
name: Build Mishwark APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.MISHWARK_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "ERROR: Keystore secret is empty"
            exit 1
          fi

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mishwark-release.jks"

          if [ ! -s "$RUNNER_TEMP/mishwark-release.jks" ]; then
            echo "ERROR: Keystore file is empty"
            exit 1
          fi

          echo "Keystore decoded successfully"

      - name: Build APK
        env:
          MISHWARK_KEYSTORE_PATH: ${{ runner.temp }}/mishwark-release.jks
          MISHWARK_STORE_PASSWORD: ${{ secrets.MISHWARK_STORE_PASSWORD }}
          MISHWARK_KEY_PASSWORD: ${{ secrets.MISHWARK_KEY_PASSWORD }}
          MISHWARK_KEY_ALIAS: ${{ secrets.MISHWARK_KEY_ALIAS }}
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --console=plain 2>&1 | tee build.log

      - name: Get SHA Fingerprints
        env:
          MISHWARK_KEYSTORE_PATH: ${{ runner.temp }}/mishwark-release.jks
          MISHWARK_STORE_PASSWORD: ${{ secrets.MISHWARK_STORE_PASSWORD }}
          MISHWARK_KEY_PASSWORD: ${{ secrets.MISHWARK_KEY_PASSWORD }}
          MISHWARK_KEY_ALIAS: ${{ secrets.MISHWARK_KEY_ALIAS }}
        run: gradle :app:signingReport --console=plain

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mishwark-Build-Log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Mishwark-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
