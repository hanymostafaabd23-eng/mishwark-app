
name: Build Mishwark APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Show project files
        run: find app/src/main -type f

      - name: Build APK
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace --console=plain 2>&1 | tee build.log

      - name: Get SHA Fingerprints
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          echo "APK certificate fingerprints:"
          keytool -printcert -jarfile "$APK"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mishwark-Build-Log
          path: build.log
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Mishwark-Test-APK
          path: app/build/outputs/apk/debug/app-debug.apk
